<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подарочек для зайки)</title>
<style>
:root{
  --bg:#fff1f4;--fg:#9f1239;--btn-bg:#e11d48;--btn-fg:#fff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#13060c;--fg:#ff9db6;--btn-bg:#ff5c85;--btn-fg:#2b0613;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#13060c;--fg:#ff9db6;--btn-bg:#ff5c85;--btn-fg:#2b0613;color-scheme:dark}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  transition:background .8s ease,color .8s ease;
}
#stage{flex:1;min-height:0;position:relative}
#c{position:absolute;inset:0;display:block;cursor:pointer}
footer{display:flex;justify-content:center;gap:10px;padding:6px 16px 20px;flex-wrap:wrap}
button{
  font:inherit;font-size:15px;font-weight:600;border:0;border-radius:999px;
  padding:11px 26px;background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;
  transition:transform .15s,opacity .3s,background .5s;
  -webkit-tap-highlight-color:transparent;
}
button:hover{transform:scale(1.04)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
button.muted{opacity:.5}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="Сердце, собранное из слов «Я тебя люблю» на разных языках" role="img"></canvas>
</div>
<footer>
  <button id="again" type="button">Ещё раз</button>
  <button id="sound" type="button" class="muted">♪ Звук</button>
</footer>
<script>
(function () {
  "use strict";

  var PHRASES = [
    "Я тебя люблю","I love you","Je t’aime","Ich liebe dich","Te quiero","Ti amo",
    "Eu te amo","Ik hou van je","Jag älskar dig","Jeg elsker deg","Minä rakastan sinua",
    "Kocham cię","Miluji tě","Szeretlek","Te iubesc","Σ’αγαπώ","Seni seviyorum",
    "Я цябе кахаю","Обичам те","Volim te","Ľúbim ťa","Ljubim te","Mi amas vin",
    "我爱你","愛してる","사랑해","أحبك","אני אוהב אותך","دوستت دارم",
    "मैं तुमसे प्यार करता हूँ","আমি তোমাকে ভালোবাসি","ฉันรักเธอ","Tôi yêu bạn",
    "Aku cinta kamu","Mahal kita","Ես քեզ սիրում եմ","მიყვარხარ","Мен сені сүйемін",
    "Men seni sevaman","Ma armastan sind","Es tevi mīlu","Aš tave myliu","Ég elska þig",
    "Ninakupenda","Tá grá agam duit","Rwy’n dy garu di","Aloha au iā ʻoe",
    "Aroha au ki a koe","Te amo","Jeg elsker dig",
    "Eg elskar deg","Ik hâld fan dy","Is breá liom tú","Volim te","Nakupenda","S'agapo",
    "Milujem ťa","Мен сені жақсы көремін","Unë të dua","Te dua","Āmo te","Alofa ia te oe",
    "Au domoni iko","Kei te aroha au ki a koe","Обичам те","Те сакам","Волим те",
    "Mīlu tevi","Myliu tave","Armastan sind","Ich hab dich lieb","Jeg elsker deg",
    "Rakastan sinua","Mám ťa rád","Мен сени жакшы көрөм","Seni sevaman"
  ];

  var FONT_STACK = 'system-ui,"Segoe UI",Roboto,"Noto Sans",sans-serif';
  var SOUND_START = 100;
  var VOLUME_ON = 0.85;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var btnAgain = document.getElementById('again');
  var btnSound = document.getElementById('sound');
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var view = { w: 0, h: 0, dpr: 1 };
  var heart = { scale: 1, cx: 0, cy: 0, fontSize: 10 };
  var glyphs = [];
  var particles = [];
  var startedAt = performance.now();

  function clamp(v, min, max) {
    return v < min ? min : v > max ? max : v;
  }

  function easeOutCubic(p) {
    return 1 - Math.pow(1 - p, 3);
  }

  function isDarkTheme() {
    var forced = document.documentElement.dataset.theme;
    if (forced) return forced === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function shuffled(arr) {
    var out = arr.slice();
    for (var i = out.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = out[i]; out[i] = out[j]; out[j] = tmp;
    }
    return out;
  }

  function makeParticles() {
    particles = [];
    for (var i = 0; i < 800; i++) {
      particles.push({
        sx: Math.random(),
        sy: Math.random(),
        phase: Math.random() * Math.PI * 2,
        delay: Math.random() * 4.0,
        rot: (Math.random() - 0.5) * 0.8,
        rand: Math.random()
      });
    }
  }

  function pointInsideHeart(px, py) {
    var u = (px - heart.cx) / heart.scale;
    var v = (heart.cy - py) / heart.scale + 0.13;
    var a = u * u + v * v - 1;
    return a * a * a - u * u * v * v * v <= 0;
  }

  function layout() {
    var rect = canvas.parentElement.getBoundingClientRect();
    view.w = rect.width;
    view.h = rect.height;
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = view.w * view.dpr;
    canvas.height = view.h * view.dpr;
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);

    heart.cx = view.w / 2;
    heart.cy = view.h / 2;
    heart.scale = Math.min(view.w * 0.48, view.h * 0.47);
    heart.fontSize = clamp(heart.scale * 0.058, 7, 18);

    var lineHeight = heart.fontSize * 1.45;
    var minGap = heart.fontSize * 0.55;
    var fs = heart.fontSize;

    ctx.font = '500 ' + fs + 'px ' + FONT_STACK;

    var pool = shuffled(PHRASES);
    var widths = pool.map(function (w) { return ctx.measureText(w).width; });
    var heartCharWidth = ctx.measureText('♥').width;

    var top = heart.cy - 1.13 * heart.scale;
    var bottom = heart.cy + 1.13 * heart.scale;
    var result = [];
    var cursor = 0;

    for (var y = top + lineHeight / 2; y < bottom - lineHeight * 0.3; y += lineHeight) {
      var runs = [];
      var runStart = null;

      for (var x = heart.cx - 1.2 * heart.scale; x <= heart.cx + 1.2 * heart.scale; x++) {
        var ok = pointInsideHeart(x, y)
              && pointInsideHeart(x, y - fs * 0.5)
              && pointInsideHeart(x, y + fs * 0.5);
        if (ok && runStart === null) runStart = x;
        if (!ok && runStart !== null) {
          runs.push([runStart + 2, x - 2]);
          runStart = null;
        }
      }

      for (var r = 0; r < runs.length; r++) {
        var from = runs[r][0];
        var to = runs[r][1];
        var span = to - from;
        if (span < fs) continue;

        var row = [];
        var used = 0;

        for (;;) {
          var picked = -1;
          for (var j = 0; j < pool.length; j++) {
            var idx = (cursor + j) % pool.length;
            var needed = used + widths[idx] + (row.length ? minGap : 0);
            if (needed <= span) { picked = idx; break; }
          }
          if (picked < 0) break;
          used += widths[picked] + (row.length ? minGap : 0);
          row.push({ text: pool[picked], w: widths[picked] });
          cursor = picked + 1;
        }

        if (!row.length) {
          if (heartCharWidth <= span) row.push({ text: '♥', w: heartCharWidth });
          else continue;
        }

        var n = row.length;
        var sumW = row.reduce(function (s, o) { return s + o.w; }, 0);
        var gap = n > 1 ? Math.min((span - sumW) / (n - 1), fs * 2.2) : 0;
        var cursorX = from + (span - (sumW + gap * (n - 1))) / 2;

        for (var k = 0; k < row.length; k++) {
          var item = row[k];
          result.push({ text: item.text, x: cursorX + item.w / 2, y: y });
          cursorX += item.w + gap;
        }
      }
    }

    glyphs = result.map(function (o, i) {
      var p = particles[i % particles.length];
      return {
        text: o.text,
        x: o.x,
        y: o.y,
        nx: p.sx,
        ny: p.sy,
        phase: p.phase,
        delay: p.delay,
        rot: p.rot,
        rand: p.rand,
        heightRatio: (o.y - top) / (bottom - top),
        drawDur: 2.5 + p.rand * 2.5
      };
    });
  }

  function heartbeat(t) {
    var m = t % 1.7;
    return Math.exp(-Math.pow((m - 0.12) / 0.07, 2))
         + 0.7 * Math.exp(-Math.pow((m - 0.4) / 0.09, 2));
  }

  var audio = new Audio('angel.mp3');
  audio.volume = 0;
  audio.preload = 'auto';

  var soundEnabled = false;
  var fadeTimer = null;
  var seekApplied = false;

  function applySeek() {
    if (!seekApplied && audio.duration > SOUND_START) {
      audio.currentTime = SOUND_START;
      seekApplied = true;
    }
  }

  audio.addEventListener('loadedmetadata', applySeek);
  audio.addEventListener('play', applySeek);
  audio.addEventListener('ended', function () {
    audio.currentTime = SOUND_START;
    audio.play();
  });

  function fadeVolume(target, duration) {
    if (fadeTimer) clearInterval(fadeTimer);
    var from = audio.volume;
    var steps = 40;
    var i = 0;
    fadeTimer = setInterval(function () {
      i++;
      var k = i / steps;
      audio.volume = Math.min(1, Math.max(0, from + (target - from) * k));
      if (i >= steps) {
        clearInterval(fadeTimer);
        fadeTimer = null;
        if (target === 0) audio.pause();
      }
    }, duration / steps);
  }

  function setSoundUi(on) {
    if (on) {
      btnSound.classList.remove('muted');
      btnSound.textContent = '♪ Звук вкл';
    } else {
      btnSound.classList.add('muted');
      btnSound.textContent = '♪ Звук';
    }
  }

  function enableSound() {
    if (audio.duration > SOUND_START) {
      audio.currentTime = SOUND_START;
      seekApplied = true;
    }
    return audio.play().then(function () {
      fadeVolume(VOLUME_ON, 3000);
      setSoundUi(true);
    });
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
      enableSound().catch(function (err) {
        console.warn('audio failed', err);
        soundEnabled = false;
        setSoundUi(false);
      });
    } else {
      fadeVolume(0, 1500);
      setSoundUi(false);
    }
  }

  function handleCanvasTap() {
    replay();
    if (!soundEnabled) {
      soundEnabled = true;
      enableSound().catch(function () { soundEnabled = false; });
    }
    canvas.removeEventListener('click', handleCanvasTap);
  }

  function drawWord(it, t, appear, dark, pulse) {
    var local = clamp((t - 0.4 - it.delay * 3.0) / it.drawDur, 0, 1);
    if (local <= 0) return;

    var p = easeOutCubic(local);
    var w = 1 - p;

    var sx = it.nx * view.w + Math.sin(t * 0.4 + it.phase) * 10 * w;
    var sy = it.ny * view.h + Math.cos(t * 0.3 + it.phase * 1.3) * 10 * w;
    var tx = heart.cx + (it.x - heart.cx) * pulse;
    var ty = heart.cy + (it.y - heart.cy) * pulse;

    var x = sx + (tx - sx) * p;
    var y = sy + (ty - sy) * p;

    var hue = 352 - 20 * it.heightRatio;
    var sat = 25 + 60 * p;
    var light = (dark ? 68 : 44) + appear * 5 * Math.sin(t * 1.5 + it.phase);

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(w * it.rot);
    ctx.globalAlpha = p;

    if (p > 0.15) {
      ctx.shadowColor = 'hsla(' + hue + ', 80%, ' + (dark ? 70 : 60) + '%, ' + (0.35 * p) + ')';
      ctx.shadowBlur = 12 * p;
    }

    ctx.fillStyle = 'hsl(' + hue + ' ' + sat + '% ' + light + '%)';
    var wordScale = 0.72 + 0.28 * p;
    ctx.font = '500 ' + (heart.fontSize * wordScale * pulse) + 'px ' + FONT_STACK;

    var tw = ctx.measureText(it.text).width;
    var revealW = tw * p;
    ctx.beginPath();
    ctx.rect(-tw / 2 - 2, -heart.fontSize, revealW + 4, heart.fontSize * 2);
    ctx.clip();

    ctx.fillText(it.text, 0, 0);
    ctx.restore();
  }

  function frame(now) {
    var t = (now - startedAt) / 1000;
    var dark = isDarkTheme();

    ctx.clearRect(0, 0, view.w, view.h);

    var appear = easeOutCubic(clamp((t - 0.4) / 8.0, 0, 1));
    var beatAmt = reducedMotion ? 0 : heartbeat(t);
    var pulse = 1 + 0.03 * beatAmt * appear;

    if (appear > 0) {
      var rgb = dark ? '255,70,120' : '225,29,72';
      var grad = ctx.createRadialGradient(
        heart.cx, heart.cy, 0,
        heart.cx, heart.cy, heart.scale * 1.3 * pulse
      );
      grad.addColorStop(0, 'rgba(' + rgb + ',' + (0.22 * appear * (dark ? 1 : 0.55)) + ')');
      grad.addColorStop(1, 'rgba(' + rgb + ',0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, view.w, view.h);
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (var i = 0; i < glyphs.length; i++) {
      drawWord(glyphs[i], t, appear, dark, pulse);
    }

    requestAnimationFrame(frame);
  }

  function replay() {
    makeParticles();
    layout();
    startedAt = performance.now();
  }

  btnAgain.addEventListener('click', replay);
  btnSound.addEventListener('click', toggleSound);
  canvas.addEventListener('click', handleCanvasTap);
  new ResizeObserver(function () { layout(); }).observe(canvas.parentElement);

  makeParticles();
  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
