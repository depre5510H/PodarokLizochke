<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подарочек для зайки)</title>
<style>
:root{
  --bg:#fff1f4;--fg:#9f1239;--btn-bg:#e11d48;--btn-fg:#fff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#13060c;--fg:#ff9db6;--btn-bg:#ff5c85;--btn-fg:#2b0613;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#13060c;--fg:#ff9db6;--btn-bg:#ff5c85;--btn-fg:#2b0613;color-scheme:dark}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  transition:background .8s ease,color .8s ease;
}
#stage{flex:1;min-height:0;position:relative}
#c{position:absolute;inset:0;display:block;cursor:pointer}
footer{display:flex;justify-content:center;gap:10px;padding:6px 16px 20px;flex-wrap:wrap}
button{
  font:inherit;font-size:15px;font-weight:600;border:0;border-radius:999px;
  padding:11px 26px;background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;
  transition:transform .15s,opacity .3s,background .5s;
  -webkit-tap-highlight-color:transparent;
}
button:hover{transform:scale(1.04)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
button.muted{opacity:.5}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="Сердце, собранное из слов «Я тебя люблю» на разных языках" role="img"></canvas>
</div>
<footer>
  <button id="again" type="button">Ещё раз</button>
  <button id="sound" type="button" class="muted">♪ Звук</button>
</footer>
<script>
(()=>{
const WORDS=[
"Я тебя люблю","I love you","Je t’aime","Ich liebe dich","Te quiero","Ti amo",
"Eu te amo","Ik hou van je","Jag älskar dig","Jeg elsker deg","Minä rakastan sinua",
"Kocham cię","Miluji tě","Szeretlek","Te iubesc","Σ’αγαπώ","Seni seviyorum",
"Я цябе кахаю","Обичам те","Volim te","Ľúbim ťa","Ljubim te","Mi amas vin",
"我爱你","愛してる","사랑해","أحبك","אני אוהב אותך","دوستت دارم",
"मैं तुमसे प्यार करता हूँ","আমি তোমাকে ভালোবাসি","ฉันรักเธอ","Tôi yêu bạn",
"Aku cinta kamu","Mahal kita","Ես քեզ սիրում եմ","მიყვარხარ","Мен сені сүйемін",
"Men seni sevaman","Ma armastan sind","Es tevi mīlu","Aš tave myliu","Ég elska þig",
"Ninakupenda","Tá grá agam duit","Rwy’n dy garu di","Aloha au iā ʻoe",
"Aroha au ki a koe","Te amo","Jeg elsker dig",
"Eg elskar deg","Ik hâld fan dy","Is breá liom tú","Volim te","Nakupenda","S'agapo",
"Milujem ťa","Мен сені жақсы көремін","Unë të dua","Te dua","Āmo te","Alofa ia te oe",
"Au domoni iko","Kei te aroha au ki a koe","Обичам те","Те сакам","Волим те",
"Mīlu tevi","Myliu tave","Armastan sind","Ich hab dich lieb","Jeg elsker deg",
"Rakastan sinua","Mám ťa rád","Мен сени жакшы көрөм","Seni sevaman"
];

const FONT='system-ui,"Segoe UI",Roboto,"Noto Sans",sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

let W=0,H=0,dpr=1,scale=1,cx=0,cy=0,fs=10;
let items=[],rnd=[],t0=performance.now();

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const easeOut=p=>1-Math.pow(1-p,3);
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function seed(){
  rnd=Array.from({length:800},()=>({
    sx:Math.random(),sy:Math.random(),
    ph:Math.random()*6.28,
    d0:Math.random()*2.8,
    rot:(Math.random()-.5)*0.8,
    r:Math.random()
  }));
}

function inside(px,py){
  const u=(px-cx)/scale;
  const v=(cy-py)/scale+.13;
  const a=u*u+v*v-1;
  return a*a*a-u*u*v*v*v<=0;
}

function layout(){
  const r=cv.parentElement.getBoundingClientRect();
  W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2;cy=H/2;

  // Сердце больше: занимает почти весь экран
  scale=Math.min(W*.48,H*.47);

  // Слова меньше
  fs=clamp(scale*.058,7,18);

  const lh=fs*1.45,gapMin=fs*.55;
  ctx.font=`500 ${fs}px ${FONT}`;
  const order=shuffle(WORDS.slice());
  const widths=order.map(w=>ctx.measureText(w).width);
  const hw=ctx.measureText('♥').width;
  const top=cy-1.13*scale,bot=cy+1.13*scale;
  const out=[];let k=0;

  for(let y=top+lh/2;y<bot-lh*.3;y+=lh){
    const runs=[];let a=null;
    for(let x=cx-1.2*scale;x<=cx+1.2*scale;x++){
      const ok=inside(x,y)&&inside(x,y-fs*.5)&&inside(x,y+fs*.5);
      if(ok&&a===null)a=x;
      if(!ok&&a!==null){runs.push([a+2,x-2]);a=null}
    }
    for(const [a0,b0] of runs){
      const L=b0-a0;
      if(L<fs)continue;
      const row=[];let used=0;
      for(;;){
        let pick=-1;
        for(let j=0;j<order.length;j++){
          const i=(k+j)%order.length;
          if(used+widths[i]+(row.length?gapMin:0)<=L){pick=i;break}
        }
        if(pick<0)break;
        used+=widths[pick]+(row.length?gapMin:0);
        row.push({text:order[pick],w:widths[pick]});
        k=pick+1;
      }
      if(!row.length){
        if(hw<=L)row.push({text:'♥',w:hw});
        else continue;
      }
      const n=row.length;
      const sumW=row.reduce((s,o)=>s+o.w,0);
      const gap=n>1?Math.min((L-sumW)/(n-1),fs*2.2):0;
      let x=a0+(L-(sumW+gap*(n-1)))/2;
      for(const o of row){
        out.push({text:o.text,x:x+o.w/2,y});
        x+=o.w+gap;
      }
    }
  }

  items=out.map((o,i)=>{
    const q=rnd[i%rnd.length];
    return Object.assign(o,q,{
      ny:(o.y-top)/(bot-top),
      d1:clamp(Math.hypot(o.x-cx,o.y-cy)/(1.2*scale),0,1)*2.0+q.r*.8,
      drawDur:0.9+q.r*1.1
    });
  });
}

const beat=t=>{
  const m=t%1.7;
  return Math.exp(-Math.pow((m-.12)/.07,2))+.7*Math.exp(-Math.pow((m-.4)/.09,2));
};

/* ---------- АУДИО: локальный файл angel.mp3, старт с 1:40 ---------- */
const audioEl = new Audio('angel.mp3');
audioEl.volume = 0;
audioEl.preload = 'auto';

const START_AT = 100;

let soundOn = false;
let fadeTimer = null;
let seekDone = false;

audioEl.addEventListener('loadedmetadata', () => {
  if (!seekDone && audioEl.duration > START_AT) {
    audioEl.currentTime = START_AT;
    seekDone = true;
  }
});
audioEl.addEventListener('ended', () => {
  audioEl.currentTime = START_AT;
  audioEl.play();
});
audioEl.addEventListener('play', () => {
  if (!seekDone && audioEl.duration > START_AT) {
    audioEl.currentTime = START_AT;
    seekDone = true;
  }
});

function fadeTo(target, duration = 1200) {
  if (fadeTimer) clearInterval(fadeTimer);
  const start = audioEl.volume;
  const steps = 40;
  let i = 0;
  fadeTimer = setInterval(() => {
    i++;
    const k = i / steps;
    audioEl.volume = Math.min(1, Math.max(0, start + (target - start) * k));
    if (i >= steps) {
      clearInterval(fadeTimer);
      fadeTimer = null;
      if (target === 0) audioEl.pause();
    }
  }, duration / steps);
}

function toggleSound() {
  soundOn = !soundOn;
  const btn = document.getElementById('sound');
  if (soundOn) {
    if (audioEl.duration > START_AT) {
      audioEl.currentTime = START_AT;
      seekDone = true;
    }
    audioEl.play().then(() => {
      fadeTo(0.85, 1500);
      btn.classList.remove('muted');
      btn.textContent = '♪ Звук вкл';
    }).catch(err => {
      console.warn('Не удалось запустить аудио:', err);
      soundOn = false;
    });
  } else {
    fadeTo(0, 900);
    btn.classList.add('muted');
    btn.textContent = '♪ Звук';
  }
}

function firstTouchSound() {
  if (!soundOn) {
    soundOn = true;
    const btn = document.getElementById('sound');
    if (audioEl.duration > START_AT) {
      audioEl.currentTime = START_AT;
      seekDone = true;
    }
    audioEl.play().then(() => {
      fadeTo(0.85, 1500);
      btn.classList.remove('muted');
      btn.textContent = '♪ Звук вкл';
    }).catch(() => { soundOn = false; });
  }
  cv.removeEventListener('click', firstTouchSound);
}

/* ---------- АНИМАЦИЯ ---------- */
function frame(now){
  const t=(now-t0)/1000;
  const dark=isDark();

  ctx.clearRect(0,0,W,H);

  const appear=easeOut(clamp((t-0.4)/4.2,0,1));
  const beatAmt=reduce?0:beat(t);
  const s=1+.03*beatAmt*appear;

  if(appear>0){
    const c=dark?'255,70,120':'225,29,72';
    const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,scale*1.3*s);
    rg.addColorStop(0,`rgba(${c},${.22*appear*(dark?1:.55)})`);
    rg.addColorStop(1,`rgba(${c},0)`);
    ctx.fillStyle=rg;
    ctx.fillRect(0,0,W,H);
  }

  ctx.textAlign='center';
  ctx.textBaseline='middle';

  for(const it of items){
    const local = clamp((t - 0.4 - it.d0*1.4) / it.drawDur, 0, 1);
    if(local <= 0) continue;

    const p = easeOut(local);
    const w = 1 - p;

    const sx = it.sx * W + Math.sin(t*0.6 + it.ph) * 10 * w;
    const sy = it.sy * H + Math.cos(t*0.5 + it.ph*1.3) * 10 * w;
    const tx = cx + (it.x - cx) * s;
    const ty = cy + (it.y - cy) * s;

    const x = sx + (tx - sx) * p;
    const y = sy + (ty - sy) * p;

    const hue = 352 - 20 * it.ny;
    const sat = 25 + 60 * p;
    const l = (dark ? 68 : 44) + appear * 5 * Math.sin(t*2 + it.ph);

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(w * it.rot);

    ctx.globalAlpha = p;

    if(p > 0.15){
      ctx.shadowColor = `hsla(${hue}, 80%, ${dark?70:60}%, ${0.35 * p})`;
      ctx.shadowBlur = 10 * p;
    }

    ctx.fillStyle = `hsl(${hue} ${sat}% ${l}%)`;
    const wordScale = 0.72 + 0.28 * p;
    ctx.font = `500 ${fs * wordScale * s}px ${FONT}`;

    const tw = ctx.measureText(it.text).width;
    const revealW = tw * p;
    ctx.beginPath();
    ctx.rect(-tw/2 - 2, -fs, revealW + 4, fs*2);
    ctx.clip();

    ctx.fillText(it.text, 0, 0);

    ctx.restore();
  }

  requestAnimationFrame(frame);
}

function replay(){
  seed();
  layout();
  t0=performance.now();
}

document.getElementById('again').addEventListener('click',replay);
document.getElementById('sound').addEventListener('click',toggleSound);
cv.addEventListener('click',()=>{replay();firstTouchSound();});
new ResizeObserver(()=>layout()).observe(cv.parentElement);

seed();
layout();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
